<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eventually!</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>eventually!</h1>
        <p>Track personal tasks, deadlines, progress, and upcoming reminders.</p>
      </header>

      <section id="auth-section" class="panel">
        <header>
          <h2>Welcome!</h2>
          <p>Log in or create an account to manage your tasks.</p>
        </header>
        <div id="auth-toggle" class="auth-toggle">
          <button id="show-login-button" type="button">Log in</button>
          <button id="show-register-button" type="button">Create Account</button>
        </div>

        <p id="auth-message" aria-live="polite"></p>

        <div class="auth-grid">
          <form id="register-form" class="card hidden">
            <h2>Create account</h2>
            <label>
              Username
              <input name="username" type="text" required />
            </label>
            <label>
              Password
              <input name="password" type="password" required />
            </label>
            <div class="actions">
              <button type="submit">Register</button>
              <button type="button" class="secondary auth-back-button">Back</button>
            </div>
          </form>

          <form id="login-form" class="card hidden">
            <h2>Log in</h2>
            <label>
              Username
              <input name="username" type="text" required />
            </label>
            <label>
              Password
              <input name="password" type="password" required />
            </label>
            <div class="actions">
              <button type="submit">Log in</button>
              <button type="button" class="secondary auth-back-button">Back</button>
            </div>
          </form>
        </div>
      </section>

      <section id="app-section" class="panel hidden">
        <div class="toolbar">
          <div>
            <h2 id="welcome-message"></h2>
          </div>
          <button id="logout-button" type="button">Log out</button>
        </div>
        <p id="status-message" class="toast hidden" aria-live="polite"></p>

        <div id="reminder-panel" class="card hidden">
          <h3>Upcoming reminders (next 24 hours)</h3>
          <ul id="reminder-list"></ul>
        </div>

        <form id="task-form" class="card">
          <h3 id="task-form-title">Add task</h3>
          <input id="task-id" type="hidden" />
          <label>
            Description
            <input id="description" type="text" required />
          </label>
          <label>
            Deadline
            <input id="deadline" type="datetime-local" required />
          </label>
          <div class="actions">
            <button type="submit" id="save-task-button">Save task</button>
            <button type="button" id="cancel-edit-button" class="secondary hidden">Cancel edit</button>
          </div>
        </form>

        <section class="card controls">
          <label>
            Search
            <input id="search" type="search" placeholder="Find a task" />
          </label>
          <label>
            Status
            <select id="status-filter">
              <option value="all">All</option>
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
            </select>
          </label>
          <label>
            Sort
            <select id="sort-order">
              <option value="deadline_asc">Deadline (earliest first)</option>
              <option value="deadline_desc">Deadline (latest first)</option>
              <option value="status">Completion status</option>
            </select>
          </label>
        </section>

        <section class="card">
          <h3>Your tasks</h3>
          <ul id="task-list" class="task-list"></ul>
          <p id="empty-state" class="hidden">No tasks match the current filters.</p>
          <div id="pagination" class="pagination hidden">
            <button id="prev-page-button" type="button" class="secondary">Previous</button>
            <span id="pagination-status"></span>
            <button id="next-page-button" type="button" class="secondary">Next</button>
          </div>
        </section>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
